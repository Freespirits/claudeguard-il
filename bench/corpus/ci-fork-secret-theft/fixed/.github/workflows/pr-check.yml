name: pr-check
on: pull_request

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run build
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "Reviewing: $TITLE"
